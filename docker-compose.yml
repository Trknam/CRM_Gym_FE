services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: gym-crm-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: npm run dev
    restart: unless-stopped

volumes:
  frontend_node_modules:
  frontend_next:
