services:
  postgres:
    image: postgres:16-alpine
    container_name: gym-crm-postgres
    environment:
      POSTGRES_DB: gymcrm
      POSTGRES_USER: gymcrm
      POSTGRES_PASSWORD: gymcrm_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymcrm -d gymcrm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: gym-crm-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://gymcrm:gymcrm_password@postgres:5432/gymcrm?schema=public}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@gymcrm.local}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Admin@123456}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Quản trị hệ thống}
      INITIAL_BRANCH_CODE: ${INITIAL_BRANCH_CODE:-CN001}
      INITIAL_BRANCH_NAME: ${INITIAL_BRANCH_NAME:-Chi nhánh chính}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: npm run dev
    restart: unless-stopped

volumes:
  frontend_node_modules:
  frontend_next:
  postgres_data:
